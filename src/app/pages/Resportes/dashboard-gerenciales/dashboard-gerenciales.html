<div class="main">
  <div class="page">
    <!-- ============ Lanzador de reportes ============ -->
    <ng-container *ngIf="!showViewer">
      <header class="hero">
        <nav class="crumbs" aria-label="Ubicación">
          <ol>
            <li>
              <button type="button" *ngIf="showHistorico" (click)="desactivarHistorico()">Reportes gerenciales</button>
              <span *ngIf="!showHistorico" aria-current="page">Reportes gerenciales</span>
              <mat-icon class="crumb-sep" *ngIf="showHistorico" aria-hidden="true">chevron_right</mat-icon>
            </li>
            <li *ngIf="showHistorico"><span aria-current="page">Resumen CE</span></li>
          </ol>
        </nav>
        <p class="hero__sub">
          {{ showHistorico ? 'Resúmenes históricos de consulta externa por año.' : 'Tableros de Power BI con los indicadores de gestión.' }}
          <span class="dot-sep" aria-hidden="true"></span>
          <span><strong class="num">{{ availableCount }}</strong> disponibles</span>
        </p>
      </header>

      <div class="report-grid">
        <button type="button" class="report" *ngFor="let tile of visibleTiles; let i = index; trackBy: trackByLabel"
          [class.is-soon]="!tile.available" [disabled]="!tile.available" [style.--i]="i" (click)="onTileClick(tile)"
          [attr.aria-label]="tile.available ? tile.label : tile.label + ' (próximamente)'">
          <span class="report__art" aria-hidden="true"><img [src]="tile.img" alt="" loading="lazy" /></span>
          <span class="report__label">{{ tile.label }}</span>
          <span class="report__meta">
            <ng-container *ngIf="!tile.available"><mat-icon>schedule</mat-icon>Próximamente</ng-container>
            <ng-container *ngIf="tile.available && tile.opensHistorico">3 años<mat-icon>chevron_right</mat-icon></ng-container>
            <ng-container *ngIf="tile.available && !tile.opensHistorico">Ver tablero<mat-icon>arrow_forward</mat-icon></ng-container>
          </span>
        </button>
      </div>
    </ng-container>

    <!-- ============ Visor del reporte (Power BI) ============ -->
    <section class="viewer" *ngIf="showViewer" aria-labelledby="viewer-title">
      <header class="viewer__bar">
        <button type="button" class="btn btn-outline-light" (click)="closeViewer()">
          <mat-icon>arrow_back</mat-icon>
          {{ showHistorico ? 'Resumen CE' : 'Reportes' }}
        </button>

        <div class="viewer__title">
          <h1 id="viewer-title">{{ selectedTitle }}</h1>
        </div>

        <div class="viewer__switch" role="tablist" aria-label="Cambiar de reporte" *ngIf="viewerSiblings.length > 1">
          <button type="button" role="tab" *ngFor="let t of viewerSiblings" class="chip"
            [class.is-active]="t.key === selectedKey" [attr.aria-selected]="t.key === selectedKey"
            (click)="openReport(t.key)">{{ t.label }}</button>
        </div>

        <a class="btn btn-light" [href]="selectedRawUrl" target="_blank" rel="noopener" *ngIf="selectedRawUrl">
          <mat-icon>open_in_new</mat-icon>
          <span class="hide-sm">Abrir en pestaña nueva</span>
        </a>
      </header>

      <div class="viewer__frame">
        <div class="viewer__loading" *ngIf="isViewerLoading" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>Cargando tablero…</span>
        </div>
        <iframe id="rg-iframe" [title]="selectedTitle" [src]="selectedUrl" (load)="onIframeLoad()" allowfullscreen></iframe>
      </div>
    </section>
  </div>
</div>
