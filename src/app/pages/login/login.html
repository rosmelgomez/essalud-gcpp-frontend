<div class="main">
  <div class="login-wrapper">
    <div class="login-panel">
      <div class="panel-logo">
        <img src="/images/SIEST.png" alt="SIEST" />
      </div>
      <div class="panel-text">
        <span class="eyebrow">Suite de reportes</span>
        <h1>Panel EsSalud</h1>
        <p>Monitoreo y analítica para decisiones rápidas.</p>
        <div class="panel-tags">
          <span class="tag">Acceso seguro</span>
          <span class="tag">Uso interno</span>
        </div>
      </div>
    </div>

    <div class="container login-card">
      <div class="card-header">
        <h2>Iniciar sesión</h2>
        <p class="small">Accede con tu usuario y contraseña asignada.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()" autocomplete="off">

        <div class="field" aria-hidden="false">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="#9aa7b2" stroke-width="1.2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M3.6 20.4a8.4 8.4 0 0 1 16.8 0" stroke="#9aa7b2" stroke-width="1.2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <div class="input-wrap">
            <input type="text" name="username" placeholder="Usuario" aria-label="Usuario" formControlName="username"
              required />
          </div>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="11" width="18" height="10" rx="2" stroke="#9aa7b2" stroke-width="1.2" />
            <path d="M7 11V8a5 5 0 0 1 10 0v3" stroke="#9aa7b2" stroke-width="1.2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <div class="input-wrap">
            <input [type]="showPassword ? 'text' : 'password'" name="password" placeholder="Contraseña"
              aria-label="Contraseña" formControlName="password" required />
            <button type="button" (click)="togglePassword()" class="toggle-password"
              aria-label="Mostrar u ocultar contraseña">
              <svg height="20" viewBox="-64 0 512 512" width="20" xmlns="http://www.w3.org/2000/svg"
                *ngIf="showPassword">
                <path
                  d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0">
                </path>
                <path
                  d="m304 224c-8.832031 0-16-7.167969-16-16v-80c0-52.929688-43.070312-96-96-96s-96 43.070312-96 96v80c0 8.832031-7.167969 16-16 16s-16-7.167969-16-16v-80c0-70.59375 57.40625-128 128-128s128 57.40625 128 128v80c0 8.832031-7.167969 16-16 16zm0 0">
                </path>
              </svg>
              <svg viewBox="0 0 576 512" height="1em" xmlns="http://www.w3.org/2000/svg" *ngIf="!showPassword">
                <path
                  d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.5 78.1-95.4 93-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C433.5 68.8 368.8 32 288 32zM144 256a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm144-64c0 35.3-28.7 64-64 64c-7.1 0-13.9-1.2-20.3-3.3c-5.5-1.8-11.9 1.6-11.7 7.4c.3 6.9 1.3 13.8 3.2 20.7c13.7 51.2 66.4 81.6 117.6 67.9s81.6-66.4 67.9-117.6c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3z">
                </path>
              </svg>
            </button>
          </div>
        </div>

        <div class="controls">
          <label>
            <input type="checkbox" name="remember" aria-label="Recordarme" />
            Recordarme
          </label>
          <a class="help-link" href="mailto:rosmel.gomez@essalud.gob.pe">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit">
          <span class="btn-icon">→</span>
          <span>Ingresar</span>
        </button>


        <div class="secondary-link">Solicita  acceso al siest <a
            href="/solicitar-acceso-registro">solicitar</a>.</div>
      </form>
    </div>
  </div>
</div>
