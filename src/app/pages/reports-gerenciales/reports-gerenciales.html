<div class="main">
  <div class="modules-container" [class.viewer-active]="showViewer">

    <div class="modules-menu" id="reportes_gerenciales">
      <div class="module" (click)="openReport(data_urls[0].atenciones_ce || '',$event)">
        <img src="/images/order_1420037.png" alt="Atenciones" />
        <span>Atenciones CE</span>
      </div>

      <div class="module" (click)="openReport(data_urls[1].atendidos_ce || '',$event)">
        <img src="/images/shortlist_8915786.png" alt="Atendidos" />
        <span>Atendidos CE</span>
      </div>

      <div href="" class="module" (click)="openReport( data_urls[2].atendidos_topico_eme || '', $event)">
        <img src="/images/ambulance.png" alt="Atención por topicós - EME" />
        <span>Atención por topicós - EME</span>
      </div>
      <div href="" class="module" (click)="openReport('', $event)">
        <img src="/images/resumen.png" alt="Resumen CE 2025" />
        <span>Resumen CE 2025</span>
      </div>

      <div class="module inactive" title="Módulo no disponible">
        <img src="/images/accidente.png" alt="Accidentes" />
        <span>Accidentes</span>
      </div>
      <div class="module inactive" title="Módulo no disponible">
        <img src="/images/diferimiento.png" alt="Diferimiento de citas CE" />
        <span>Diferimiento de citas CE</span>
      </div>

      <div class="module inactive" title="Módulo no disponible">
        <img src="/images/analytics.png" alt="Reportes" />
        <span>Reportes Gerenciales</span>
      </div>
    </div>

    <button class="btn-change-reportes" title="volver reportes" id="btn_historico" >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="12 5 19 12 12 19"></polyline>
          <polyline points="19 12 5 12"></polyline>
        </svg>
        Volver a reportes
      </button>

    <div class="modules-menu" id="historico_ce">
      <div class="module" (click)="openReport(data_urls[3].resumen_ce_2023 || '', $event)">
        <img src="/images/resumen.png" alt="Atenciones" />
        <span>Resumen - CE - 2023</span>
      </div>

      <div class="module" (click)="openReport(data_urls[4].resumen_ce_2024 || '',$event)">
        <img src="/images/resumen.png" alt="Atendidos" />
        <span>Resumen - CE - 2024</span>
      </div>

      <div href="" class="module" (click)="openReport( data_urls[5].resumen_ce_2025 || '', $event)">
        <img src="/images/resumen.png" alt="Atención por topicós - EME" />
        <span>Resumen - CE - 2025</span>
      </div>

    </div>


    <!-- Visor embebido para abrir el reporte debajo de las cards -->
    <div id="rg-viewer" class="viewer-slot" *ngIf="showViewer">
      <div class="viewer-card">
        <div class="viewer-header">
          <span class="viewer-title">Reporte</span>
          <button class="btn-close-viewer" (click)="closeViewer()">✕</button>
        </div>
        <iframe id="rg-iframe" title="Reporte" [src]="selectedUrl"></iframe>
      </div>
    </div>
  </div>
</div>
